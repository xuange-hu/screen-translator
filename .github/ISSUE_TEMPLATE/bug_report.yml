name: Bug report
description: Report a problem with ScreenTranslator
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in as much as you can — it helps us reproduce fast.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce it? (capture mode, monitor setup, language, provider…)
      placeholder: |
        1. Press Ctrl+Shift+A and select …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: dropdown
    id: capture
    attributes:
      label: Capture mode
      options: ["Region", "Full screen", "Current window", "Live region monitoring", "Other / not sure"]
    validations:
      required: false
  - type: dropdown
    id: ocr
    attributes:
      label: OCR engine
      options: ["Windows OCR", "PaddleOCR (component)", "Both", "Not sure"]
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: From Settings → About, or the git tag / commit.
      placeholder: "v0.3.0-beta"
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: OS & Python
      placeholder: "Windows 11 23H2, Python 3.12.3"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: From %LOCALAPPDATA%\ScreenTranslator\logs. Redact anything sensitive — logs are auto-sanitized, but double-check.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not pasted API keys, screenshots, or personal content.
          required: true

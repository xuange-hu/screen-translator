name: CI

# 闭环「测试只在打 tag 触发」的缺口：在 PR 与 push 到 main 时也跑测试，
# 让合并前的回归能尽早被发现（release-windows.yml 仍只在打 tag 时构建/发布）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # 纯逻辑测试：不安装 PySide6，在 ubuntu 上几秒出结果。
  # 之所以单独拆一个作业，是因为完整的 GUI/集成套件必须装 PySide6 且跑在
  # windows-latest（见 test 作业），反馈慢得多；这里对「不依赖 Qt 的模块」
  # 提供快速回归信号。新增纯逻辑用例时请一并加入本作业的文件清单。
  pure:
    name: Pure-logic tests (no PySide6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest + mypy
        run: python -m pip install --upgrade pip pytest "mypy==1.*"

      - name: Run PySide6-free tests
        run: |
          python -m pytest \
            tests/test_hotkey_parser.py \
            tests/test_version.py \
            tests/test_runtime.py \
            tests/test_language_utils.py \
            -q

      - name: Type-check PySide6-free modules
        # 增量式类型门禁：只对不依赖 Qt 的模块做强制检查，避免 GUI 代码的历史
        # 注解债务阻塞合并。文件清单随纯逻辑抽离推进而扩大。
        run: |
          python -m mypy \
            app/hotkey_parser.py \
            app/version.py \
            app/runtime.py \
            --ignore-missing-imports

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-core.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt pytest

      - name: Run tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

  lint:
    # 静态质量门禁：语法/未定义名/未用导入/导入排序（ruff）。
    # 增量式规则集见仓库根 pyproject.toml，随清理推进逐步收紧。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install "ruff==0.17.*"
      - name: Ruff check
        run: ruff check .

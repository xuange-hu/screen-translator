<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F7BFF"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="920" height="520" fill="url(#bg)"/>

  <!-- faux "source screen" -->
  <rect x="40" y="40" width="840" height="400" rx="14" fill="#0b1220" stroke="#334155" stroke-width="1"/>
  <text x="64" y="78" fill="#475569" font-size="13">某游戏 / 漫画 / 视频字幕（原文，无法直接复制）</text>

  <!-- original (foreign) text lines -->
  <g fill="#64748b" opacity="0.85">
    <rect x="64" y="110" width="220" height="12" rx="6"/>
    <rect x="64" y="134" width="160" height="12" rx="6"/>
    <rect x="64" y="158" width="200" height="12" rx="6"/>
    <rect x="64" y="196" width="180" height="12" rx="6"/>
    <rect x="64" y="220" width="240" height="12" rx="6"/>
    <rect x="520" y="300" width="190" height="12" rx="6"/>
    <rect x="520" y="324" width="150" height="12" rx="6"/>
  </g>

  <!-- translated overlay blocks -->
  <g>
    <rect x="300" y="104" width="250" height="34" rx="8" fill="#f8fafc" opacity="0.96"/>
    <text x="314" y="126" fill="#0f172a" font-size="15">敌人正在接近，</text>
    <rect x="300" y="146" width="200" height="30" rx="8" fill="#f8fafc" opacity="0.96"/>
    <text x="314" y="166" fill="#0f172a" font-size="15">快躲进掩体！</text>

    <!-- newly changed block: fade-in highlight -->
    <rect x="300" y="190" width="280" height="40" rx="8" fill="#f8fafc" opacity="0.96" filter="url(#glow)" stroke="#2F7BFF" stroke-width="2"/>
    <text x="314" y="214" fill="#0f172a" font-size="15">获得道具：能量核心 ✦</text>
  </g>

  <!-- monitoring selection box with handles -->
  <rect x="290" y="92" width="320" height="160" rx="10" fill="#2F7BFF" fill-opacity="0.06" stroke="url(#accent)" stroke-width="2"/>
  <g fill="#2F7BFF">
    <rect x="284" y="86" width="12" height="12" rx="2"/>
    <rect x="444" y="86" width="12" height="12" rx="2"/>
    <rect x="604" y="86" width="12" height="12" rx="2"/>
    <rect x="284" y="246" width="12" height="12" rx="2"/>
    <rect x="444" y="246" width="12" height="12" rx="2"/>
    <rect x="604" y="246" width="12" height="12" rx="2"/>
    <rect x="284" y="166" width="12" height="12" rx="2"/>
    <rect x="604" y="166" width="12" height="12" rx="2"/>
  </g>
  <g fill="#0f172a" opacity="0.82">
    <rect x="290" y="56" width="186" height="26" rx="13"/>
  </g>
  <text x="304" y="73" fill="#7dd3fc" font-size="13">拖拽调整 · 双击停止</text>

  <!-- caption -->
  <text x="40" y="478" fill="#94a3b8" font-size="14">实时监控：拖拽选区即可移动/缩放，文字变化处淡入高亮 —— 变化一眼可见</text>
</svg>
